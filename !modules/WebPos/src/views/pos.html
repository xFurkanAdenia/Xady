<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Terminal</title>
</head>
<body>
    <!-- POS Terminal Container -->
    <div class="pos-terminal">
        <!-- Header -->
        <div class="pos-header">
            <div>
                <h1 class="pos-header-title">💳 POS Terminal</h1>
                <p class="pos-header-subtitle">Ödeme Takip ve Yönetim Sistemi</p>
            </div>
            <div class="pos-stats">
                <div class="pos-stat">
                    <div class="pos-stat-label">Bekleyen</div>
                    <div class="pos-stat-value" id="pos-count-pending">0</div>
                </div>
                <div class="pos-stat">
                    <div class="pos-stat-label">Tamamlanan</div>
                    <div class="pos-stat-value" id="pos-count-done">0</div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="pos-tabs">
            <button class="pos-tab active" data-tab="active" onclick="posShowTab('active')">
                ⏳ Aktif Ödemeler
            </button>
            <button class="pos-tab" data-tab="history" onclick="posShowTab('history')">
                📋 Geçmiş
            </button>
            <button class="pos-tab" data-tab="create" onclick="posShowTab('create')">
                ➕ Ödeme Oluştur
            </button>
        </div>

        <!-- Tab Content: Active Payments -->
        <div class="pos-tab-content active" id="pos-tab-active">
            <div class="pos-grid" id="pos-active-grid"></div>
        </div>

        <!-- Tab Content: History -->
        <div class="pos-tab-content" id="pos-tab-history">
            <div class="pos-grid" id="pos-history-grid"></div>
        </div>

        <!-- Tab Content: Create Payment -->
        <div class="pos-tab-content" id="pos-tab-create">
            <div class="pos-create-form">
                <h3 style="margin-top: 0;">Yeni Ödeme Talebi</h3>
                
                <div class="form-group">
                    <label class="form-label">Oyuncu Adı *</label>
                    <input 
                        type="text" 
                        id="pos-new-username" 
                        class="form-control" 
                        placeholder="Örn: StevePlayer"
                        autocomplete="off"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Tutar (⛁) *</label>
                    <input 
                        type="number" 
                        id="pos-new-amount" 
                        class="form-control" 
                        placeholder="0.00" 
                        min="0.01" 
                        step="0.01"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Açıklama</label>
                    <input 
                        type="text" 
                        id="pos-new-desc" 
                        class="form-control" 
                        placeholder="VIP paket, ürün satışı, vb..."
                    />
                </div>

                <button 
                    class="btn btn-primary btn-lg" 
                    id="pos-create-btn" 
                    onclick="posCreatePayment()"
                    style="width: 100%;"
                >
                    💳 Ödeme Oluştur
                </button>
            </div>
        </div>
    </div>

    <!-- Refund Modal -->
    <div class="pos-modal" id="pos-refund-modal">
        <div class="pos-modal-content">
            <div class="pos-modal-header">
                <h3 class="pos-modal-title">↩️ İade İşlemi</h3>
                <button class="pos-modal-close" onclick="posCloseRefundModal()">×</button>
            </div>
            
            <div class="pos-modal-body">
                <input type="hidden" id="refund-payment-id" />
                <input type="hidden" id="refund-type" value="amount" />
                
                <div class="pos-refund-info">
                    <strong>Oyuncu:</strong> <span id="refund-username"></span><br>
                    <strong>Maksimum İade:</strong> <span id="refund-max-amount"></span>⛁
                </div>

                <div class="form-group">
                    <label class="form-label">İade Tipi</label>
                    <div class="pos-refund-toggle">
                        <button class="active" data-type="amount" onclick="posToggleRefundType('amount')">
                            💰 Tutar
                        </button>
                        <button data-type="percentage" onclick="posToggleRefundType('percentage')">
                            📊 Yüzde
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">İade Miktarı</label>
                    <input 
                        type="number" 
                        id="refund-amount" 
                        class="form-control" 
                        placeholder="0.00" 
                        min="0.01" 
                        step="0.01"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">İade Nedeni (Opsiyonel)</label>
                    <input 
                        type="text" 
                        id="refund-reason" 
                        class="form-control" 
                        placeholder="İade sebebini yazınız..."
                    />
                </div>
            </div>

            <div class="pos-modal-footer">
                <button class="btn btn-secondary" onclick="posCloseRefundModal()">
                    İptal
                </button>
                <button 
                    class="btn btn-warning" 
                    id="refund-confirm-btn" 
                    onclick="posProcessRefund()"
                >
                    ✓ İade Et
                </button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="pos-modal" id="pos-detail-modal">
        <div class="pos-modal-content pos-modal-large">
            <div class="pos-modal-header">
                <h3 class="pos-modal-title">📋 Ödeme Detayları</h3>
                <button class="pos-modal-close" onclick="posCloseDetailModal()">×</button>
            </div>
            
            <div class="pos-modal-body">
                <div class="pos-detail-summary">
                    <div class="pos-detail-item">
                        <div class="pos-detail-label">Oyuncu</div>
                        <div class="pos-detail-value" id="detail-username">-</div>
                    </div>
                    <div class="pos-detail-item">
                        <div class="pos-detail-label">Orijinal Tutar</div>
                        <div class="pos-detail-value" id="detail-original-amount">-</div>
                    </div>
                    <div class="pos-detail-item">
                        <div class="pos-detail-label">Toplam İade</div>
                        <div class="pos-detail-value pos-text-danger" id="detail-total-refunded">-</div>
                    </div>
                    <div class="pos-detail-item">
                        <div class="pos-detail-label">Net Tutar</div>
                        <div class="pos-detail-value pos-text-success" id="detail-net-amount">-</div>
                    </div>
                </div>

                <h4 class="pos-detail-section-title">İade Geçmişi</h4>
                <div class="pos-detail-table-wrapper">
                    <table class="pos-detail-table">
                        <thead>
                            <tr>
                                <th>Tarih</th>
                                <th>Miktar</th>
                                <th>İade Eden</th>
                                <th>Sebep</th>
                            </tr>
                        </thead>
                        <tbody id="detail-refund-history">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="pos-modal-footer">
                <button class="btn btn-secondary" onclick="posCloseDetailModal()">
                    Kapat
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="pos.js"></script>
</body>
</html>
