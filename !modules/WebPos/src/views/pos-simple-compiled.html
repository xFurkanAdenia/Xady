<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Sistemi</title>
<style>/* POS Basit Tasarım */
.pos-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

/* Header */
.pos-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border, #333);
}

.pos-header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main, #e0e0e0);
}

.pos-subtitle {
    margin: 4px 0 0;
    color: var(--text-muted, #888);
    font-size: 14px;
}

.pos-balance-card {
    background: var(--bg-surface, #2a2a2a);
    border: 1px solid var(--border, #444);
    border-radius: 8px;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
}

.pos-balance-label {
    font-size: 12px;
    color: var(--text-muted, #888);
    margin-bottom: 4px;
}

.pos-balance-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--success, #2ecc71);
}

/* Tabs */
.pos-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--border, #333);
}

.pos-tab {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted, #888);
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 6px 6px 0 0;
}

.pos-tab:hover {
    color: var(--text-main, #e0e0e0);
    background: rgba(255, 255, 255, 0.05);
}

.pos-tab.active {
    color: var(--primary, #7c63f5);
    border-bottom-color: var(--primary, #7c63f5);
    background: rgba(124, 99, 245, 0.1);
}

.pos-tab-content {
    display: none;
}

.pos-tab-content.active {
    display: block;
}

/* Card */
.pos-card {
    background: var(--bg-surface, #1e1e1e);
    border: 1px solid var(--border, #333);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 20px;
}

.pos-card h2 {
    margin: 0 0 20px;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-main, #e0e0e0);
}

.pos-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.pos-card-header h2 {
    margin: 0;
}

/* Product Selection */
.pos-product-selection {
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border, #333);
}

.pos-product-hint {
    font-size: 13px;
    color: var(--text-muted, #888);
    margin-bottom: 12px;
}

.pos-product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
}

.pos-product-quick {
    background: var(--bg-base, #0a0a0a);
    border: 2px solid var(--border, #333);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
}

.pos-product-quick:hover {
    border-color: var(--primary, #7c63f5);
    transform: translateY(-2px);
}

.pos-product-quick-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main, #e0e0e0);
    margin-bottom: 6px;
}

.pos-product-quick-price {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary, #7c63f5);
}

/* Form */
.pos-form {
    max-width: 500px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main, #e0e0e0);
}

.form-control {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    background: var(--bg-base, #0a0a0a);
    border: 1px solid var(--border, #333);
    border-radius: 6px;
    color: var(--text-main, #e0e0e0);
    transition: border-color 0.2s;
    box-sizing: border-box;
}

.form-control:focus {
    outline: none;
    border-color: var(--primary, #7c63f5);
    box-shadow: 0 0 0 3px rgba(124, 99, 245, 0.1);
}

.form-control::placeholder {
    color: var(--text-muted, #666);
}

select.form-control {
    cursor: pointer;
}

.form-text {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-muted, #666);
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

/* Buttons */
.btn {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-primary {
    background: var(--primary, #7c63f5);
    color: #fff;
}

.btn-primary:hover {
    background: var(--primary-hover, #6952d4);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(124, 99, 245, 0.3);
}

.btn-secondary {
    background: var(--bg-base, #2a2a2a);
    color: var(--text-main, #e0e0e0);
    border: 1px solid var(--border, #444);
}

.btn-secondary:hover {
    background: var(--bg-hover, #3a3a3a);
}

.btn-success {
    background: var(--success, #2ecc71);
    color: #fff;
}

.btn-success:hover {
    background: #27ae60;
}

.btn-warning {
    background: var(--warning, #f39c12);
    color: #fff;
}

.btn-warning:hover {
    background: #e67e22;
}

.btn-danger {
    background: var(--danger, #e74c3c);
    color: #fff;
}

.btn-danger:hover {
    background: #c0392b;
}

.btn-lg {
    padding: 14px 28px;
    font-size: 16px;
    width: 100%;
}

.btn-sm {
    padding: 6px 12px;
    font-size: 12px;
}

.btn-xs {
    padding: 2px 6px;
    font-size: 11px;
}

/* Products List */
.pos-products-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
}

.pos-product-item {
    background: var(--bg-base, #0a0a0a);
    border: 1px solid var(--border, #333);
    border-radius: 8px;
    padding: 16px;
    transition: all 0.2s;
}

.pos-product-item:hover {
    border-color: var(--primary, #7c63f5);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(124, 99, 245, 0.2);
}

.pos-product-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-main, #e0e0e0);
}

.pos-product-price {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary, #7c63f5);
    margin-bottom: 8px;
}

.pos-product-desc {
    font-size: 12px;
    color: var(--text-muted, #888);
    margin-bottom: 12px;
}

.pos-product-actions-info {
    font-size: 11px;
    color: var(--text-muted, #666);
    margin-bottom: 12px;
    padding: 4px 8px;
    background: rgba(124, 99, 245, 0.1);
    border-radius: 4px;
    display: inline-block;
}

.pos-product-actions {
    display: flex;
    gap: 8px;
}

/* Actions List */
.pos-actions-list {
    margin-bottom: 12px;
    max-height: 200px;
    overflow-y: auto;
}

.pos-action-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    margin-bottom: 8px;
    background: var(--bg-base, #0a0a0a);
    border: 1px solid var(--border, #333);
    border-radius: 6px;
    font-size: 13px;
}

.pos-action-item span {
    flex: 1;
    word-break: break-all;
}

.pos-empty-small {
    padding: 20px;
    text-align: center;
    color: var(--text-muted, #666);
    font-size: 12px;
}

/* Payment Grid */
.pos-payments-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
}

.pos-payment-card {
    background: var(--bg-surface, #1e1e1e);
    border: 2px solid var(--border, #333);
    border-radius: 8px;
    padding: 16px;
    transition: all 0.3s;
}

.pos-payment-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.pos-payment-card.status-pending {
    border-color: var(--primary, #7c63f5);
}

.pos-payment-card.status-success {
    border-color: var(--success, #2ecc71);
}

.pos-payment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.pos-payment-user {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main, #e0e0e0);
}

.pos-payment-amount {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary, #7c63f5);
}

.pos-payment-desc {
    font-size: 13px;
    color: var(--text-muted, #888);
    margin-bottom: 12px;
}

.pos-payment-meta {
    font-size: 12px;
    color: var(--text-muted, #666);
    margin-bottom: 12px;
}

.pos-payment-actions {
    display: flex;
    gap: 8px;
}

/* Timer Bar */
.pos-payment-timer {
    height: 4px;
    background: rgba(124, 99, 245, 0.2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 12px;
}

.pos-payment-timer-fill {
    height: 100%;
    background: var(--primary, #7c63f5);
    transition: width 1s linear;
}

.pos-payment-timer-fill.warning {
    background: var(--warning, #f39c12);
}

.pos-payment-timer-fill.danger {
    background: var(--danger, #e74c3c);
}

/* Badge */
.pos-badge {
    display: inline-block;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 4px;
    text-transform: uppercase;
}

.pos-badge-success {
    background: rgba(46, 204, 113, 0.2);
    color: var(--success, #2ecc71);
}

.pos-badge-pending {
    background: rgba(124, 99, 245, 0.2);
    color: var(--primary, #7c63f5);
}

/* Empty State */
.pos-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted, #666);
}

.pos-empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
}

.pos-empty-text {
    font-size: 16px;
}

/* Modal */
.pos-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.pos-modal-content {
    background: var(--bg-surface, #1e1e1e);
    border: 1px solid var(--border, #333);
    border-radius: 12px;
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}

.pos-modal-sm {
    max-width: 400px;
}

.pos-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border, #333);
}

.pos-modal-header h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-main, #e0e0e0);
}

.pos-modal-close {
    background: none;
    border: none;
    font-size: 28px;
    color: var(--text-muted, #888);
    cursor: pointer;
    padding: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
}

.pos-modal-close:hover {
    color: var(--text-main, #e0e0e0);
}

.pos-modal-body {
    padding: 24px;
}

.pos-modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid var(--border, #333);
}

.pos-refund-info {
    background: var(--bg-base, #0a0a0a);
    border: 1px solid var(--border, #333);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.6;
}

.pos-refund-info div {
    margin-bottom: 4px;
}

/* Responsive */
@media (max-width: 768px) {
    .pos-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
    }

    .pos-tabs {
        overflow-x: auto;
        flex-wrap: nowrap;
    }

    .pos-tab {
        white-space: nowrap;
    }

    .pos-product-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    }

    .pos-products-list,
    .pos-payments-grid {
        grid-template-columns: 1fr;
    }

    .pos-modal-content {
        max-width: 100%;
    }
}
</style></head>
<body>
    <div class="pos-container">
        <!-- Header -->
        <div class="pos-header">
            <div class="pos-header-left">
                <h1>💳 POS Sistemi</h1>
                <p class="pos-subtitle">Ödeme Yönetimi</p>
            </div>
            <div class="pos-header-right">
                <div class="pos-balance-card">
                    <span class="pos-balance-label">Bakiye</span>
                    <span class="pos-balance-value" id="pos-balance">0.00⛁</span>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="pos-tabs">
            <button class="pos-tab active" data-tab="create" onclick="posShowTab('create')">
                💳 Ödeme Al
            </button>
            <button class="pos-tab" data-tab="products" onclick="posShowTab('products')">
                📦 Ürünler
            </button>
            <button class="pos-tab" data-tab="active" onclick="posShowTab('active')">
                ⏳ Aktif (<span id="count-active">0</span>)
            </button>
            <button class="pos-tab" data-tab="history" onclick="posShowTab('history')">
                📋 Geçmiş
            </button>
        </div>

        <!-- Tab: Ödeme Al -->
        <div class="pos-tab-content active" id="tab-create">
            <div class="pos-card">
                <h2>Yeni Ödeme Talebi</h2>
                
                <!-- Ürün Seçimi -->
                <div class="pos-product-selection" id="product-selection">
                    <!-- Ürünler buraya -->
                </div>

                <div class="pos-form">
                    <div class="form-group">
                        <label>Oyuncu Adı *</label>
                        <input type="text" id="input-username" class="form-control" placeholder="Minecraft oyuncu adı">
                    </div>
                    <div class="form-group">
                        <label>Tutar (⛁) *</label>
                        <input type="number" id="input-amount" class="form-control" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Açıklama</label>
                        <input type="text" id="input-description" class="form-control" placeholder="İsteğe bağlı">
                    </div>
                    <button class="btn btn-primary btn-lg" onclick="posCreatePayment()">
                        💳 Ödeme Talebi Oluştur
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab: Ürünler -->
        <div class="pos-tab-content" id="tab-products">
            <div class="pos-card">
                <div class="pos-card-header">
                    <h2>Ürünlerim</h2>
                    <button class="btn btn-success" onclick="posShowProductModal()">
                        + Yeni Ürün
                    </button>
                </div>
                <div class="pos-products-list" id="products-list">
                    <!-- Ürünler buraya -->
                </div>
            </div>
        </div>

        <!-- Tab: Aktif Ödemeler -->
        <div class="pos-tab-content" id="tab-active">
            <div class="pos-payments-grid" id="active-grid">
                <!-- Aktif ödemeler -->
            </div>
        </div>

        <!-- Tab: Geçmiş -->
        <div class="pos-tab-content" id="tab-history">
            <div class="pos-payments-grid" id="history-grid">
                <!-- Geçmiş ödemeler -->
            </div>
        </div>
    </div>

    <!-- Modal: Ürün Ekle/Düzenle -->
    <div class="pos-modal" id="product-modal">
        <div class="pos-modal-content">
            <div class="pos-modal-header">
                <h2 id="product-modal-title">Yeni Ürün Ekle</h2>
                <button class="pos-modal-close" onclick="posCloseProductModal()">&times;</button>
            </div>
            <div class="pos-modal-body">
                <input type="hidden" id="product-edit-id">
                <div class="form-group">
                    <label>Ürün Adı *</label>
                    <input type="text" id="product-name" class="form-control" placeholder="Ürün adı">
                </div>
                <div class="form-group">
                    <label>Fiyat (⛁) *</label>
                    <input type="number" id="product-price" class="form-control" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>Açıklama</label>
                    <input type="text" id="product-description" class="form-control" placeholder="İsteğe bağlı">
                </div>
                <div class="form-group">
                    <label>Komut / Fonksiyonlar</label>
                    <div id="product-actions-list" class="pos-actions-list">
                        <!-- Actions buraya -->
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="posShowActionModal()">
                        + Ekle
                    </button>
                </div>
            </div>
            <div class="pos-modal-footer">
                <button class="btn btn-secondary" onclick="posCloseProductModal()">İptal</button>
                <button class="btn btn-primary" onclick="posSaveProduct()">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Modal: Komut/Fonksiyon Ekle -->
    <div class="pos-modal" id="action-modal">
        <div class="pos-modal-content pos-modal-sm">
            <div class="pos-modal-header">
                <h2>Komut / Fonksiyon Ekle</h2>
                <button class="pos-modal-close" onclick="posCloseActionModal()">&times;</button>
            </div>
            <div class="pos-modal-body">
                <div class="form-group">
                    <label>Tip</label>
                    <select id="action-type" class="form-control" onchange="posActionTypeChanged()">
                        <option value="command">Komut</option>
                        <option value="function" id="action-type-function">Fonksiyon</option>
                    </select>
                </div>
                <div class="form-group" id="action-command-group">
                    <label>Komut</label>
                    <input type="text" id="action-command" class="form-control" placeholder="/give {player} diamond 1">
                    <small class="form-text">{player} yerine oyuncu adı gelecek</small>
                </div>
                <div class="form-group" id="action-function-group" style="display: none;">
                    <label>Fonksiyon</label>
                    <select id="action-function" class="form-control">
                        <option value="">Fonksiyon seçiniz...</option>
                    </select>
                </div>
            </div>
            <div class="pos-modal-footer">
                <button class="btn btn-secondary" onclick="posCloseActionModal()">İptal</button>
                <button class="btn btn-primary" onclick="posAddAction()">Ekle</button>
            </div>
        </div>
    </div>

    <!-- Modal: İade -->
    <div class="pos-modal" id="refund-modal">
        <div class="pos-modal-content pos-modal-sm">
            <div class="pos-modal-header">
                <h2>Ödeme İadesi</h2>
                <button class="pos-modal-close" onclick="posCloseRefundModal()">&times;</button>
            </div>
            <div class="pos-modal-body">
                <input type="hidden" id="refund-payment-id">
                <div class="pos-refund-info" id="refund-info"></div>
                <div class="form-group">
                    <label>İade Tipi</label>
                    <select id="refund-type" class="form-control">
                        <option value="amount">Tutar</option>
                        <option value="percentage">Yüzde</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Miktar</label>
                    <input type="number" id="refund-amount" class="form-control" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>Sebep</label>
                    <input type="text" id="refund-reason" class="form-control" placeholder="İsteğe bağlı">
                </div>
            </div>
            <div class="pos-modal-footer">
                <button class="btn btn-secondary" onclick="posCloseRefundModal()">İptal</button>
                <button class="btn btn-danger" onclick="posProcessRefund()">İade Et</button>
            </div>
        </div>
    </div>

    <script>// POS Simple JavaScript
(function() {
    'use strict';

    const state = {
        activeTab: 'create',
        balance: 0,
        products: [],
        functions: [],
        activePayments: [],
        historyPayments: [],
        eventSource: null,
        tempActions: [], // Modal'da eklenen action'lar
        editingProductId: null
    };

    // ═══════════════════════════════════════════════════════════
    // UTILS
    // ═══════════════════════════════════════════════════════════
    function formatAmount(amount) {
        return Number(amount).toLocaleString('tr-TR', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function formatTime(timestamp) {
        return new Date(timestamp).toLocaleString('tr-TR');
    }

    // ═══════════════════════════════════════════════════════════
    // TABS
    // ═══════════════════════════════════════════════════════════
    window.posShowTab = function(tabName) {
        state.activeTab = tabName;

        document.querySelectorAll('.pos-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.tab === tabName);
        });

        document.querySelectorAll('.pos-tab-content').forEach(content => {
            content.classList.toggle('active', content.id === `tab-${tabName}`);
        });

        if (tabName === 'create') renderProductSelection();
        else if (tabName === 'products') loadProducts();
        else if (tabName === 'active') loadActivePayments();
        else if (tabName === 'history') loadHistoryPayments();
    };

    // ═══════════════════════════════════════════════════════════
    // API
    // ═══════════════════════════════════════════════════════════
    async function loadBalance() {
        try {
            const res = await fetch('/api/pos/balance');
            const data = await res.json();
            if (data.ok) {
                state.balance = data.balance;
                document.getElementById('pos-balance').textContent = formatAmount(data.balance) + '⛁';
            }
        } catch (error) {
            console.error('[POS] Balance error:', error);
        }
    }

    async function loadProducts() {
        try {
            const res = await fetch('/api/pos/products');
            const data = await res.json();
            if (data.ok) {
                state.products = data.products;
                renderProducts();
            }
        } catch (error) {
            console.error('[POS] Products error:', error);
        }
    }

    async function loadFunctions() {
        try {
            const res = await fetch('/api/pos/functions');
            const data = await res.json();
            if (data.ok) {
                state.functions = data.functions;
            }
        } catch (error) {
            console.error('[POS] Functions error:', error);
        }
    }

    async function loadActivePayments() {
        try {
            const res = await fetch('/api/pos/payments');
            const data = await res.json();
            if (data.ok) {
                state.activePayments = data.payments;
                renderActivePayments();
                document.getElementById('count-active').textContent = data.payments.length;
            }
        } catch (error) {
            console.error('[POS] Active payments error:', error);
        }
    }

    async function loadHistoryPayments() {
        try {
            const res = await fetch('/api/pos/history');
            const data = await res.json();
            if (data.ok) {
                state.historyPayments = data.payments;
                renderHistoryPayments();
            }
        } catch (error) {
            console.error('[POS] History error:', error);
        }
    }

    // ═══════════════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════════════
    function renderProductSelection() {
        const container = document.getElementById('product-selection');
        if (!container) return;

        if (state.products.length === 0) {
            container.innerHTML = '<div class="pos-product-hint">Ürün eklemek için "Ürünler" sekmesine gidin</div>';
            return;
        }

        container.innerHTML = `
            <div class="pos-product-hint">Hızlı seçim için bir ürün seçin:</div>
            <div class="pos-product-grid">
                ${state.products.map(p => `
                    <div class="pos-product-quick" onclick="posSelectQuickProduct('${p.id}')">
                        <div class="pos-product-quick-name">${p.name}</div>
                        <div class="pos-product-quick-price">${formatAmount(p.price)}⛁</div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderProducts() {
        const container = document.getElementById('products-list');
        if (!container) return;

        if (state.products.length === 0) {
            container.innerHTML = `
                <div class="pos-empty">
                    <div class="pos-empty-icon">📦</div>
                    <div class="pos-empty-text">Henüz ürün eklenmemiş</div>
                </div>
            `;
            return;
        }

        container.innerHTML = state.products.map(product => `
            <div class="pos-product-item">
                <div class="pos-product-name">${product.name}</div>
                <div class="pos-product-price">${formatAmount(product.price)}⛁</div>
                ${product.description ? `<div class="pos-product-desc">${product.description}</div>` : ''}
                ${product.actions && product.actions.length > 0 ? `
                    <div class="pos-product-actions-info">
                        ${product.actions.length} komut/fonksiyon
                    </div>
                ` : ''}
                <div class="pos-product-actions">
                    <button class="btn btn-primary btn-sm" onclick="posEditProduct('${product.id}')">
                        Düzenle
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="posDeleteProduct('${product.id}')">
                        Sil
                    </button>
                </div>
            </div>
        `).join('');
    }

    function renderActivePayments() {
        const container = document.getElementById('active-grid');
        if (!container) return;

        if (state.activePayments.length === 0) {
            container.innerHTML = `
                <div class="pos-empty">
                    <div class="pos-empty-icon">⏳</div>
                    <div class="pos-empty-text">Aktif ödeme bulunmuyor</div>
                </div>
            `;
            return;
        }

        container.innerHTML = state.activePayments.map(payment => {
            const elapsed = Date.now() - payment.createdAt;
            const timeout = 15 * 60 * 1000;
            const percentage = Math.max(0, 100 - (elapsed / timeout * 100));
            const timerClass = percentage < 20 ? 'danger' : percentage < 50 ? 'warning' : '';

            return `
                <div class="pos-payment-card status-pending">
                    <div class="pos-payment-header">
                        <div>
                            <div class="pos-payment-user">👤 ${payment.username}</div>
                            <span class="pos-badge pos-badge-pending">Bekliyor</span>
                        </div>
                        <div class="pos-payment-amount">${formatAmount(payment.amount)}⛁</div>
                    </div>
                    ${payment.description ? `<div class="pos-payment-desc">${payment.description}</div>` : ''}
                    <div class="pos-payment-meta">
                        🕐 ${formatTime(payment.createdAt)}<br>
                        👤 ${payment.createdBy}
                    </div>
                    <div class="pos-payment-timer">
                        <div class="pos-payment-timer-fill ${timerClass}" style="width: ${percentage}%"></div>
                    </div>
                    <div class="pos-payment-actions">
                        <button class="btn btn-danger btn-sm" onclick="posCancelPayment('${payment.id}')">
                            İptal
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderHistoryPayments() {
        const container = document.getElementById('history-grid');
        if (!container) return;

        if (state.historyPayments.length === 0) {
            container.innerHTML = `
                <div class="pos-empty">
                    <div class="pos-empty-icon">📋</div>
                    <div class="pos-empty-text">Henüz tamamlanan ödeme yok</div>
                </div>
            `;
            return;
        }

        container.innerHTML = state.historyPayments.slice(0, 50).map(payment => {
            const isSuccess = payment.status === 'success';
            const refunded = payment.refunds && payment.refunds.length > 0;
            const totalRefunded = payment.totalRefunded || 0;
            const netAmount = (payment.sendedMoney || payment.amount) - totalRefunded;

            return `
                <div class="pos-payment-card status-${payment.status}">
                    <div class="pos-payment-header">
                        <div>
                            <div class="pos-payment-user">👤 ${payment.username}</div>
                            <span class="pos-badge pos-badge-${isSuccess ? 'success' : 'pending'}">
                                ${isSuccess ? '✅ Tamamlandı' : '❌ İptal'}
                            </span>
                        </div>
                        <div class="pos-payment-amount">${formatAmount(payment.amount)}⛁</div>
                    </div>
                    ${payment.description ? `<div class="pos-payment-desc">${payment.description}</div>` : ''}
                    <div class="pos-payment-meta">
                        🕐 ${formatTime(payment.completedAt || payment.createdAt)}
                        ${payment.sendedMoney ? `<br>💸 Ödenen: ${formatAmount(payment.sendedMoney)}⛁` : ''}
                        ${payment.change > 0 ? `<br>🔄 Para üstü: ${formatAmount(payment.change)}⛁` : ''}
                        ${refunded ? `<br>↩️ İade: ${formatAmount(totalRefunded)}⛁ (Net: ${formatAmount(netAmount)}⛁)` : ''}
                    </div>
                    ${isSuccess ? `
                        <div class="pos-payment-actions">
                            <button class="btn btn-warning btn-sm" onclick="posShowRefundModal('${payment.id}')">
                                ↩️ İade
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    function renderActionsList() {
        const container = document.getElementById('product-actions-list');
        if (!container) return;

        if (state.tempActions.length === 0) {
            container.innerHTML = '<div class="pos-empty-small">Henüz komut/fonksiyon eklenmemiş</div>';
            return;
        }

        container.innerHTML = state.tempActions.map((action, index) => {
            let label = action.type === 'command' ? `📝 ${action.value}` : `⚙️ ${action.value}`;
            return `
                <div class="pos-action-item">
                    <span>${label}</span>
                    <button class="btn btn-danger btn-xs" onclick="posRemoveAction(${index})">×</button>
                </div>
            `;
        }).join('');
    }

    // ═══════════════════════════════════════════════════════════
    // ACTIONS - PAYMENT
    // ═══════════════════════════════════════════════════════════
    window.posSelectQuickProduct = function(id) {
        const product = state.products.find(p => p.id === id);
        if (!product) return;

        document.getElementById('input-amount').value = product.price;
        document.getElementById('input-description').value = product.name;
        document.getElementById('input-username').focus();
    };

    window.posCreatePayment = async function() {
        const username = document.getElementById('input-username').value.trim();
        const amount = parseFloat(document.getElementById('input-amount').value);
        const description = document.getElementById('input-description').value.trim();

        if (!username) return alert('Oyuncu adı gerekli');
        if (!amount || amount <= 0) return alert('Geçerli bir tutar giriniz');

        try {
            const meRes = await fetch('/api/me');
            const meData = await meRes.json();

            const res = await fetch('/api/pos/payments', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': meData.csrfToken
                },
                body: JSON.stringify({ username, amount, description })
            });
            const data = await res.json();

            if (data.ok) {
                document.getElementById('input-username').value = '';
                document.getElementById('input-amount').value = '';
                document.getElementById('input-description').value = '';
                posShowTab('active');
                if (window.showToast) window.showToast('Ödeme talebi oluşturuldu', 'success');
            } else {
                alert(data.error || 'Hata oluştu');
            }
        } catch (error) {
            alert('Bağlantı hatası');
        }
    };

    window.posCancelPayment = async function(id) {
        if (!confirm('Bu ödemeyi iptal etmek istediğinize emin misiniz?')) return;

        try {
            const meRes = await fetch('/api/me');
            const meData = await meRes.json();

            const res = await fetch(`/api/pos/payments/${id}`, {
                method: 'DELETE',
                headers: { 'X-CSRF-Token': meData.csrfToken }
            });
            const data = await res.json();

            if (data.ok) {
                loadActivePayments();
                if (window.showToast) window.showToast('Ödeme iptal edildi', 'success');
            } else {
                alert(data.error || 'Hata oluştu');
            }
        } catch (error) {
            alert('Bağlantı hatası');
        }
    };

    // ═══════════════════════════════════════════════════════════
    // ACTIONS - PRODUCT
    // ═══════════════════════════════════════════════════════════
    window.posShowProductModal = function() {
        state.editingProductId = null;
        state.tempActions = [];
        document.getElementById('product-modal-title').textContent = 'Yeni Ürün Ekle';
        document.getElementById('product-edit-id').value = '';
        document.getElementById('product-name').value = '';
        document.getElementById('product-price').value = '';
        document.getElementById('product-description').value = '';
        renderActionsList();
        document.getElementById('product-modal').style.display = 'flex';
    };

    window.posEditProduct = function(id) {
        const product = state.products.find(p => p.id === id);
        if (!product) return;

        state.editingProductId = id;
        state.tempActions = product.actions || [];
        document.getElementById('product-modal-title').textContent = 'Ürün Düzenle';
        document.getElementById('product-edit-id').value = id;
        document.getElementById('product-name').value = product.name;
        document.getElementById('product-price').value = product.price;
        document.getElementById('product-description').value = product.description || '';
        renderActionsList();
        document.getElementById('product-modal').style.display = 'flex';
    };

    window.posCloseProductModal = function() {
        document.getElementById('product-modal').style.display = 'none';
        state.tempActions = [];
        state.editingProductId = null;
    };

    window.posSaveProduct = async function() {
        const name = document.getElementById('product-name').value.trim();
        const price = parseFloat(document.getElementById('product-price').value);
        const description = document.getElementById('product-description').value.trim();
        const editId = state.editingProductId;

        if (!name) return alert('Ürün adı gerekli');
        if (!price || price <= 0) return alert('Geçerli bir fiyat giriniz');

        try {
            const meRes = await fetch('/api/me');
            const meData = await meRes.json();

            const payload = {
                name,
                price,
                description: description || undefined,
                actions: state.tempActions
            };

            let res, data;
            if (editId) {
                res = await fetch(`/api/pos/products/${editId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': meData.csrfToken
                    },
                    body: JSON.stringify(payload)
                });
            } else {
                res = await fetch('/api/pos/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': meData.csrfToken
                    },
                    body: JSON.stringify(payload)
                });
            }

            data = await res.json();

            if (data.ok) {
                posCloseProductModal();
                loadProducts();
                if (window.showToast) window.showToast(editId ? 'Ürün güncellendi' : 'Ürün eklendi', 'success');
            } else {
                alert(data.error || 'Hata oluştu');
            }
        } catch (error) {
            alert('Bağlantı hatası');
        }
    };

    window.posDeleteProduct = async function(id) {
        if (!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;

        try {
            const meRes = await fetch('/api/me');
            const meData = await meRes.json();

            const res = await fetch(`/api/pos/products/${id}`, {
                method: 'DELETE',
                headers: { 'X-CSRF-Token': meData.csrfToken }
            });
            const data = await res.json();

            if (data.ok) {
                loadProducts();
                if (window.showToast) window.showToast('Ürün silindi', 'success');
            } else {
                alert(data.error || 'Hata oluştu');
            }
        } catch (error) {
            alert('Bağlantı hatası');
        }
    };

    // ═══════════════════════════════════════════════════════════
    // ACTIONS - ACTION MODAL
    // ═══════════════════════════════════════════════════════════
    window.posShowActionModal = async function() {
        await loadFunctions();
        
        // Fonksiyon varsa göster
        const funcOption = document.getElementById('action-type-function');
        if (state.functions.length === 0) {
            funcOption.style.display = 'none';
            document.getElementById('action-type').value = 'command';
        } else {
            funcOption.style.display = 'block';
            
            // Fonksiyon listesini doldur
            const funcSelect = document.getElementById('action-function');
            funcSelect.innerHTML = '<option value="">Fonksiyon seçiniz...</option>';
            state.functions.forEach(fn => {
                const option = document.createElement('option');
                option.value = fn.id;
                option.textContent = `${fn.name} (${fn.module})`;
                funcSelect.appendChild(option);
            });
        }

        document.getElementById('action-command').value = '';
        document.getElementById('action-function').value = '';
        posActionTypeChanged();
        document.getElementById('action-modal').style.display = 'flex';
    };

    window.posCloseActionModal = function() {
        document.getElementById('action-modal').style.display = 'none';
    };

    window.posActionTypeChanged = function() {
        const type = document.getElementById('action-type').value;
        document.getElementById('action-command-group').style.display = type === 'command' ? 'block' : 'none';
        document.getElementById('action-function-group').style.display = type === 'function' ? 'block' : 'none';
    };

    window.posAddAction = function() {
        const type = document.getElementById('action-type').value;
        let value = '';

        if (type === 'command') {
            value = document.getElementById('action-command').value.trim();
            if (!value) return alert('Komut girmelisiniz');
        } else {
            value = document.getElementById('action-function').value;
            if (!value) return alert('Fonksiyon seçmelisiniz');
        }

        state.tempActions.push({
            id: `act_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
            type,
            value
        });

        renderActionsList();
        posCloseActionModal();
    };

    window.posRemoveAction = function(index) {
        state.tempActions.splice(index, 1);
        renderActionsList();
    };

    // ═══════════════════════════════════════════════════════════
    // ACTIONS - REFUND
    // ═══════════════════════════════════════════════════════════
    window.posShowRefundModal = function(paymentId) {
        const payment = state.historyPayments.find(p => p.id === paymentId);
        if (!payment) return;

        const paidAmount = payment.sendedMoney || payment.amount;
        const alreadyRefunded = payment.totalRefunded || 0;
        const availableAmount = paidAmount - alreadyRefunded;

        document.getElementById('refund-payment-id').value = paymentId;
        document.getElementById('refund-info').innerHTML = `
            <div><strong>Oyuncu:</strong> ${payment.username}</div>
            <div><strong>Ödenen:</strong> ${formatAmount(paidAmount)}⛁</div>
            ${alreadyRefunded > 0 ? `<div><strong>İade Edilmiş:</strong> ${formatAmount(alreadyRefunded)}⛁</div>` : ''}
            <div><strong>İade Edilebilir:</strong> ${formatAmount(availableAmount)}⛁</div>
        `;
        document.getElementById('refund-type').value = 'amount';
        document.getElementById('refund-amount').value = '';
        document.getElementById('refund-reason').value = '';
        document.getElementById('refund-modal').style.display = 'flex';
    };

    window.posCloseRefundModal = function() {
        document.getElementById('refund-modal').style.display = 'none';
    };

    window.posProcessRefund = async function() {
        const paymentId = document.getElementById('refund-payment-id').value;
        const type = document.getElementById('refund-type').value;
        const amount = parseFloat(document.getElementById('refund-amount').value);
        const reason = document.getElementById('refund-reason').value.trim();

        if (!amount || amount <= 0) return alert('Geçerli bir miktar giriniz');

        try {
            const meRes = await fetch('/api/me');
            const meData = await meRes.json();

            const res = await fetch(`/api/pos/payments/${paymentId}/refund`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': meData.csrfToken
                },
                body: JSON.stringify({
                    amount,
                    isPercentage: type === 'percentage',
                    reason
                })
            });
            const data = await res.json();

            if (data.ok) {
                posCloseRefundModal();
                loadHistoryPayments();
                if (window.showToast) window.showToast(`${formatAmount(data.refundAmount)}⛁ iade edildi`, 'success');
            } else {
                alert(data.error || 'Hata oluştu');
            }
        } catch (error) {
            alert('Bağlantı hatası');
        }
    };

    // ═══════════════════════════════════════════════════════════
    // SSE
    // ═══════════════════════════════════════════════════════════
    function connectSSE() {
        if (state.eventSource) state.eventSource.close();

        state.eventSource = new EventSource('/api/pos/stream');

        state.eventSource.addEventListener('pos_new', () => {
            loadActivePayments();
        });

        state.eventSource.addEventListener('pos_complete', () => {
            loadActivePayments();
            loadHistoryPayments();
            loadBalance();
        });

        state.eventSource.addEventListener('pos_cancel', () => {
            loadActivePayments();
        });

        state.eventSource.onerror = () => {
            setTimeout(connectSSE, 3000);
        };
    }

    // ═══════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════
    function init() {
        loadBalance();
        loadProducts();
        loadActivePayments();
        connectSSE();

        // Update timers
        setInterval(() => {
            if (state.activeTab === 'active') {
                renderActivePayments();
            }
        }, 1000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
