<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>POS Terminal</title>
        <style>/* POS Terminal Görünümü */
.pos-terminal {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
}

/* Header */
.pos-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
}

.pos-header-title {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    color: var(--text-main);
}

.pos-header-subtitle {
    margin: 4px 0 0;
    color: var(--text-muted);
    font-size: 13px;
}

/* Stats */
.pos-stats {
    display: flex;
    gap: 12px;
}

.pos-stat {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    min-width: 120px;
}

.pos-stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
}

.pos-stat-value {
    font-size: 24px;
    font-weight: 800;
    color: var(--text-main);
}

/* Tabs */
.pos-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--border);
}

.pos-tab {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 8px 8px 0 0;
}

.pos-tab:hover {
    color: var(--text-main);
    background: rgba(124, 99, 245, 0.05);
}

.pos-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    background: rgba(124, 99, 245, 0.1);
}

.pos-tab-content {
    display: none;
}

.pos-tab-content.active {
    display: block;
}

/* Payment Grid */
.pos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 16px;
}

/* Payment Card */
.pos-card {
    background: var(--bg-surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: all 0.3s;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.pos-card:hover {
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    transform: translateY(-4px);
}

.pos-card.status-success {
    border-color: var(--success);
    background: linear-gradient(135deg, var(--bg-surface) 0%, rgba(46, 204, 113, 0.05) 100%);
}

.pos-card.status-pending {
    border-color: var(--primary);
    background: linear-gradient(135deg, var(--bg-surface) 0%, rgba(124, 99, 245, 0.05) 100%);
}

.pos-card.status-cancelled,
.pos-card.status-timeout {
    border-color: var(--danger);
    opacity: 0.7;
}

/* Card Header */
.pos-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.pos-card-user {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
}

.pos-card-amount {
    font-size: 28px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -1px;
}

/* Badge */
.pos-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.pos-badge.pending {
    background: rgba(124, 99, 245, 0.15);
    color: var(--primary);
}

.pos-badge.success {
    background: rgba(46, 204, 113, 0.15);
    color: var(--success);
}

.pos-badge.cancelled,
.pos-badge.timeout {
    background: rgba(231, 76, 60, 0.15);
    color: var(--danger);
}

/* Card Body */
.pos-card-description {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
    line-height: 1.5;
}

.pos-card-refund-info {
    background: rgba(231, 76, 60, 0.1);
    border: 1px solid rgba(231, 76, 60, 0.3);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
}

.pos-refund-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--success);
    margin-bottom: 4px;
}

.pos-refund-amount {
    font-size: 12px;
    color: var(--danger);
    font-weight: 600;
}

.pos-card-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

/* Timer Bar */
.pos-timer {
    height: 6px;
    background: rgba(124, 99, 245, 0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
}

.pos-timer-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 3px;
    transition: width 1s linear, background 0.3s;
}

.pos-timer-fill.warning {
    background: #f39c12;
}

.pos-timer-fill.danger {
    background: var(--danger);
}

/* Card Actions */
.pos-card-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}

/* Create Form */
.pos-create-form {
    max-width: 500px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
}

.pos-create-form .form-group {
    margin-bottom: 20px;
}

.pos-create-form .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 8px;
    display: block;
}

.pos-create-form .form-control {
    width: 100%;
    padding: 12px;
    font-size: 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: var(--bg-base);
    color: var(--text-main);
    transition: border-color 0.2s;
}

.pos-create-form .form-control:focus {
    outline: none;
    border-color: var(--primary);
}

/* Empty State */
.pos-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}

.pos-empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
    opacity: 0.5;
}

.pos-empty-text {
    font-size: 16px;
    font-weight: 600;
}

/* Modal */
.pos-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    animation: fadeIn 0.2s ease;
}

.pos-modal.show {
    display: flex;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.pos-modal-content {
    background: var(--bg-surface);
    border-radius: 12px;
    padding: 24px;
    max-width: 500px;
    width: 90%;
    animation: slideUp 0.3s ease;
}

.pos-modal-large {
    max-width: 800px;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.pos-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}

.pos-modal-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-main);
}

.pos-modal-close {
    background: none;
    border: none;
    font-size: 24px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
}

.pos-modal-close:hover {
    background: var(--border);
    color: var(--text-main);
}

.pos-modal-body {
    margin-bottom: 20px;
}

.pos-modal-footer {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
}

/* Refund Input Group */
.pos-refund-input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}

.pos-refund-input {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: var(--bg-base);
    color: var(--text-main);
}

.pos-refund-input:focus {
    outline: none;
    border-color: var(--primary);
}

.pos-refund-toggle {
    display: flex;
    gap: 4px;
}

.pos-refund-toggle button {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border: 2px solid var(--border);
    border-radius: 6px;
    background: var(--bg-base);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
}

.pos-refund-toggle button.active {
    border-color: var(--primary);
    background: var(--primary);
    color: white;
}

.pos-refund-info {
    padding: 12px;
    background: rgba(124, 99, 245, 0.1);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
}

/* Responsive */
@media (max-width: 768px) {
    .pos-grid {
        grid-template-columns: 1fr;
    }

    .pos-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
    }

    .pos-stats {
        flex-wrap: wrap;
    }
}

/* Detail Modal */
.pos-detail-summary {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 24px;
}

.pos-detail-item {
    background: var(--bg-base);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
}

.pos-detail-label {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
}

.pos-detail-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-main);
}

.pos-text-success {
    color: var(--success) !important;
}

.pos-text-danger {
    color: var(--danger) !important;
}

.pos-detail-section-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 12px;
}

.pos-detail-table-wrapper {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
}

.pos-detail-table {
    width: 100%;
    border-collapse: collapse;
}

.pos-detail-table thead {
    background: var(--bg-base);
}

.pos-detail-table th {
    padding: 12px 16px;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    border-bottom: 2px solid var(--border);
}

.pos-detail-table td {
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text-main);
    border-bottom: 1px solid var(--border);
}

.pos-detail-table tbody tr:last-child td {
    border-bottom: none;
}

.pos-detail-table tbody tr:hover {
    background: rgba(124, 99, 245, 0.05);
}

.text-center {
    text-align: center;
}

@media (max-width: 768px) {
    .pos-detail-summary {
        grid-template-columns: 1fr;
    }
}
</style>
    
</head>
<body>
    <!-- POS Terminal Container -->
    <div class="pos-terminal">
        <!-- Header -->
        <div class="pos-header">
            <div>
                <h1 class="pos-header-title">💳 POS Terminal</h1>
                <p class="pos-header-subtitle">Ödeme Takip ve Yönetim Sistemi</p>
            </div>
            <div class="pos-stats">
                <div class="pos-stat">
                    <div class="pos-stat-label">Bekleyen</div>
                    <div class="pos-stat-value" id="pos-count-pending">0</div>
                </div>
                <div class="pos-stat">
                    <div class="pos-stat-label">Tamamlanan</div>
                    <div class="pos-stat-value" id="pos-count-done">0</div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="pos-tabs">
            <button class="pos-tab active" data-tab="active" onclick="posShowTab('active')">
                ⏳ Aktif Ödemeler
            </button>
            <button class="pos-tab" data-tab="history" onclick="posShowTab('history')">
                📋 Geçmiş
            </button>
            <button class="pos-tab" data-tab="create" onclick="posShowTab('create')">
                ➕ Ödeme Oluştur
            </button>
        </div>

        <!-- Tab Content: Active Payments -->
        <div class="pos-tab-content active" id="pos-tab-active">
            <div class="pos-grid" id="pos-active-grid"></div>
        </div>

        <!-- Tab Content: History -->
        <div class="pos-tab-content" id="pos-tab-history">
            <div class="pos-grid" id="pos-history-grid"></div>
        </div>

        <!-- Tab Content: Create Payment -->
        <div class="pos-tab-content" id="pos-tab-create">
            <div class="pos-create-form">
                <h3 style="margin-top: 0;">Yeni Ödeme Talebi</h3>
                
                <div class="form-group">
                    <label class="form-label">Oyuncu Adı *</label>
                    <input 
                        type="text" 
                        id="pos-new-username" 
                        class="form-control" 
                        placeholder="Örn: StevePlayer"
                        autocomplete="off"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Tutar (⛁) *</label>
                    <input 
                        type="number" 
                        id="pos-new-amount" 
                        class="form-control" 
                        placeholder="0.00" 
                        min="0.01" 
                        step="0.01"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Açıklama</label>
                    <input 
                        type="text" 
                        id="pos-new-desc" 
                        class="form-control" 
                        placeholder="VIP paket, ürün satışı, vb..."
                    />
                </div>

                <button 
                    class="btn btn-primary btn-lg" 
                    id="pos-create-btn" 
                    onclick="posCreatePayment()"
                    style="width: 100%;"
                >
                    💳 Ödeme Oluştur
                </button>
            </div>
        </div>
    </div>

    <!-- Refund Modal -->
    <div class="pos-modal" id="pos-refund-modal">
        <div class="pos-modal-content">
            <div class="pos-modal-header">
                <h3 class="pos-modal-title">↩️ İade İşlemi</h3>
                <button class="pos-modal-close" onclick="posCloseRefundModal()">×</button>
            </div>
            
            <div class="pos-modal-body">
                <input type="hidden" id="refund-payment-id" />
                <input type="hidden" id="refund-type" value="amount" />
                
                <div class="pos-refund-info">
                    <strong>Oyuncu:</strong> <span id="refund-username"></span><br>
                    <strong>Maksimum İade:</strong> <span id="refund-max-amount"></span>⛁
                </div>

                <div class="form-group">
                    <label class="form-label">İade Tipi</label>
                    <div class="pos-refund-toggle">
                        <button class="active" data-type="amount" onclick="posToggleRefundType('amount')">
                            💰 Tutar
                        </button>
                        <button data-type="percentage" onclick="posToggleRefundType('percentage')">
                            📊 Yüzde
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">İade Miktarı</label>
                    <input 
                        type="number" 
                        id="refund-amount" 
                        class="form-control" 
                        placeholder="0.00" 
                        min="0.01" 
                        step="0.01"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">İade Nedeni (Opsiyonel)</label>
                    <input 
                        type="text" 
                        id="refund-reason" 
                        class="form-control" 
                        placeholder="İade sebebini yazınız..."
                    />
                </div>
            </div>

            <div class="pos-modal-footer">
                <button class="btn btn-secondary" onclick="posCloseRefundModal()">
                    İptal
                </button>
                <button 
                    class="btn btn-warning" 
                    id="refund-confirm-btn" 
                    onclick="posProcessRefund()"
                >
                    ✓ İade Et
                </button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="pos-modal" id="pos-detail-modal">
        <div class="pos-modal-content pos-modal-large">
            <div class="pos-modal-header">
                <h3 class="pos-modal-title">📋 Ödeme Detayları</h3>
                <button class="pos-modal-close" onclick="posCloseDetailModal()">×</button>
            </div>
            
            <div class="pos-modal-body">
                <div class="pos-detail-summary">
                    <div class="pos-detail-item">
                        <div class="pos-detail-label">Oyuncu</div>
                        <div class="pos-detail-value" id="detail-username">-</div>
                    </div>
                    <div class="pos-detail-item">
                        <div class="pos-detail-label">Orijinal Tutar</div>
                        <div class="pos-detail-value" id="detail-original-amount">-</div>
                    </div>
                    <div class="pos-detail-item">
                        <div class="pos-detail-label">Toplam İade</div>
                        <div class="pos-detail-value pos-text-danger" id="detail-total-refunded">-</div>
                    </div>
                    <div class="pos-detail-item">
                        <div class="pos-detail-label">Net Tutar</div>
                        <div class="pos-detail-value pos-text-success" id="detail-net-amount">-</div>
                    </div>
                </div>

                <h4 class="pos-detail-section-title">İade Geçmişi</h4>
                <div class="pos-detail-table-wrapper">
                    <table class="pos-detail-table">
                        <thead>
                            <tr>
                                <th>Tarih</th>
                                <th>Miktar</th>
                                <th>İade Eden</th>
                                <th>Sebep</th>
                            </tr>
                        </thead>
                        <tbody id="detail-refund-history">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="pos-modal-footer">
                <button class="btn btn-secondary" onclick="posCloseDetailModal()">
                    Kapat
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    
        <script>// POS Terminal JavaScript Module
(function() {
    'use strict';

    // ═══════════════════════════════════════════════════════════
    // STATE MANAGEMENT
    // ═══════════════════════════════════════════════════════════
    const state = {
        activePayments: {},
        historyPayments: [],
        eventSource: null,
        currentTab: 'active'
    };

    // ═══════════════════════════════════════════════════════════
    // UTILITY FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    const utils = {
        formatAmount(amount) {
            if (amount == null) return '-';
            return Number(amount).toLocaleString('tr-TR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        },

        formatTime(timestamp) {
            if (!timestamp) return '-';
            return new Date(timestamp).toLocaleString('tr-TR');
        },

        escape(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        },

        getBadgeClass(status) {
            const classes = {
                'success': 'success',
                'pending': 'pending',
                'cancelled': 'cancelled',
                'timeout': 'timeout'
            };
            return classes[status] || 'pending';
        },

        getBadgeLabel(status) {
            const labels = {
                'success': '✅ Tamamlandı',
                'pending': '⏳ Bekliyor',
                'cancelled': '❌ İptal',
                'timeout': '⌛ Zaman Aşımı'
            };
            return labels[status] || '⏳ Bekliyor';
        }
    };

    // ═══════════════════════════════════════════════════════════
    // TAB MANAGEMENT
    // ═══════════════════════════════════════════════════════════
    const tabs = {
        show(tabName) {
            state.currentTab = tabName;

            // Update tab buttons
            document.querySelectorAll('.pos-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });

            // Update tab content
            document.querySelectorAll('.pos-tab-content').forEach(content => {
                content.classList.toggle('active', content.id === `pos-tab-${tabName}`);
            });
        }
    };

    // ═══════════════════════════════════════════════════════════
    // RENDER FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    const render = {
        activePaymentCard(payment) {
            const card = document.createElement('div');
            card.className = 'pos-card status-pending';
            card.id = `pcard-${payment.id}`;
            card.innerHTML = `
                <div class="pos-card-header">
                    <div>
                        <div class="pos-card-user">👤 ${utils.escape(payment.username)}</div>
                        <span class="pos-badge pending">${utils.getBadgeLabel(payment.status)}</span>
                    </div>
                    <div class="pos-card-amount">${utils.formatAmount(payment.amount)}⛁</div>
                </div>
                ${payment.description ? `<div class="pos-card-description">📝 ${utils.escape(payment.description)}</div>` : ''}
                <div class="pos-card-meta">
                    <div>🕐 ${utils.formatTime(payment.createdAt)}</div>
                    <div>👤 Oluşturan: ${utils.escape(payment.createdBy)}</div>
                </div>
                <div class="pos-timer">
                    <div class="pos-timer-fill" id="timer-${payment.id}" style="width: 100%"></div>
                </div>
                <div class="pos-card-actions">
                    <button class="btn btn-danger btn-sm" onclick="posCancel('${payment.id}')">
                        ❌ İptal
                    </button>
                </div>
            `;
            return card;
        },

        historyPaymentCard(payment) {
            const card = document.createElement('div');
            card.className = `pos-card status-${payment.status}`;
            
            const totalRefunded = payment.totalRefunded || 0;
            const netAmount = payment.amount - totalRefunded;
            const hasRefunds = totalRefunded > 0;
            
            const refundBtn = payment.status === 'success' ? `
                <button class="btn btn-warning btn-sm" onclick="posShowRefundModal('${payment.id}')">
                    ↩️ İade
                </button>
            ` : '';

            const detailBtn = hasRefunds ? `
                <button class="btn btn-info btn-sm" onclick="posShowDetailModal('${payment.id}')">
                    📋 Detaylar
                </button>
            ` : '';

            const refundInfo = hasRefunds ? `
                <div class="pos-card-refund-info">
                    <div class="pos-refund-label">Net Tutar: ${utils.formatAmount(netAmount)}⛁</div>
                    <div class="pos-refund-amount">İade Edilen: ${utils.formatAmount(totalRefunded)}⛁</div>
                </div>
            ` : '';

            card.innerHTML = `
                <div class="pos-card-header">
                    <div>
                        <div class="pos-card-user">👤 ${utils.escape(payment.username)}</div>
                        <span class="pos-badge ${utils.getBadgeClass(payment.status)}">${utils.getBadgeLabel(payment.status)}</span>
                    </div>
                    <div class="pos-card-amount">${utils.formatAmount(payment.amount)}⛁</div>
                </div>
                ${payment.description ? `<div class="pos-card-description">📝 ${utils.escape(payment.description)}</div>` : ''}
                ${refundInfo}
                <div class="pos-card-meta">
                    <div>🕐 ${utils.formatTime(payment.createdAt)} → ${utils.formatTime(payment.completedAt)}</div>
                    ${payment.sendedMoney ? `<div>💸 Ödenen: ${utils.formatAmount(payment.sendedMoney)}⛁</div>` : ''}
                    ${payment.change > 0 ? `<div>🔄 Para üstü: ${utils.formatAmount(payment.change)}⛁</div>` : ''}
                </div>
                ${refundBtn || detailBtn ? `<div class="pos-card-actions">${refundBtn}${detailBtn}</div>` : ''}
            `;
            return card;
        },

        activePayments() {
            const container = document.getElementById('pos-active-grid');
            container.innerHTML = '';

            const payments = Object.values(state.activePayments);
            
            if (payments.length === 0) {
                container.innerHTML = `
                    <div class="pos-empty">
                        <div class="pos-empty-icon">💳</div>
                        <div class="pos-empty-text">Bekleyen ödeme bulunmuyor</div>
                    </div>
                `;
            } else {
                payments.forEach(payment => {
                    container.appendChild(this.activePaymentCard(payment));
                });
            }

            document.getElementById('pos-count-pending').textContent = payments.length;
        },

        historyPayments() {
            const container = document.getElementById('pos-history-grid');
            container.innerHTML = '';

            if (state.historyPayments.length === 0) {
                container.innerHTML = `
                    <div class="pos-empty">
                        <div class="pos-empty-icon">📋</div>
                        <div class="pos-empty-text">Henüz tamamlanan ödeme yok</div>
                    </div>
                `;
            } else {
                state.historyPayments.forEach(payment => {
                    container.appendChild(this.historyPaymentCard(payment));
                });
            }

            const successCount = state.historyPayments.filter(p => p.status === 'success').length;
            document.getElementById('pos-count-done').textContent = successCount;
        },

        updateTimers() {
            const now = Date.now();
            Object.values(state.activePayments).forEach(payment => {
                const timerEl = document.getElementById(`timer-${payment.id}`);
                if (!timerEl) return;

                const timeout = 15 * 60 * 1000; // 15 minutes
                const elapsed = now - payment.createdAt;
                const percentage = Math.max(0, 100 - (elapsed / timeout * 100));

                timerEl.style.width = `${percentage}%`;
                
                if (percentage < 20) {
                    timerEl.classList.add('danger');
                    timerEl.classList.remove('warning');
                } else if (percentage < 50) {
                    timerEl.classList.add('warning');
                    timerEl.classList.remove('danger');
                } else {
                    timerEl.classList.remove('warning', 'danger');
                }
            });
        }
    };

    // ═══════════════════════════════════════════════════════════
    // API FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    const api = {
        async loadPayments() {
            try {
                const [activeRes, historyRes] = await Promise.all([
                    fetch('/api/pos/payments').then(r => r.json()),
                    fetch('/api/pos/history').then(r => r.json())
                ]);

                if (activeRes.ok) {
                    state.activePayments = {};
                    activeRes.payments.forEach(p => {
                        state.activePayments[p.id] = p;
                    });
                }

                if (historyRes.ok) {
                    state.historyPayments = historyRes.payments;
                }

                render.activePayments();
                render.historyPayments();
            } catch (error) {
                console.error('[WebPos] Load payments error:', error);
            }
        },

        async createPayment(username, amount, description) {
            try {
                const res = await fetch('/api/pos/payments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, amount, description })
                });
                const data = await res.json();
                return data;
            } catch (error) {
                console.error('[WebPos] Create payment error:', error);
                return { ok: false, error: 'Bağlantı hatası' };
            }
        },

        async cancelPayment(id) {
            try {
                const res = await fetch(`/api/pos/payments/${id}`, {
                    method: 'DELETE'
                });
                return await res.json();
            } catch (error) {
                console.error('[WebPos] Cancel payment error:', error);
                return { ok: false, error: 'Bağlantı hatası' };
            }
        },

        async refundPayment(id, amount, isPercentage, reason) {
            try {
                const res = await fetch(`/api/pos/payments/${id}/refund`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, isPercentage, reason })
                });
                return await res.json();
            } catch (error) {
                console.error('[WebPos] Refund payment error:', error);
                return { ok: false, error: 'Bağlantı hatası' };
            }
        }
    };

    // ═══════════════════════════════════════════════════════════
    // EVENT SOURCE (SSE)
    // ═══════════════════════════════════════════════════════════
    const sse = {
        connect() {
            if (state.eventSource) {
                state.eventSource.close();
            }

            state.eventSource = new EventSource('/api/pos/stream');

            state.eventSource.addEventListener('pos_new', (e) => {
                const payment = JSON.parse(e.data);
                state.activePayments[payment.id] = payment;
                render.activePayments();
                if (window.showToast) {
                    window.showToast(`💳 Yeni ödeme: ${payment.username}`, 'info');
                }
            });

            state.eventSource.addEventListener('pos_complete', (e) => {
                const payment = JSON.parse(e.data);
                delete state.activePayments[payment.id];
                state.historyPayments.unshift(payment);
                if (state.historyPayments.length > 100) {
                    state.historyPayments.pop();
                }
                render.activePayments();
                render.historyPayments();
                if (window.showToast) {
                    window.showToast(`✅ Ödeme tamamlandı: ${payment.username}`, 'success');
                }
            });

            state.eventSource.addEventListener('pos_cancel', (e) => {
                const payment = JSON.parse(e.data);
                delete state.activePayments[payment.id];
                state.historyPayments.unshift(payment);
                if (state.historyPayments.length > 100) {
                    state.historyPayments.pop();
                }
                render.activePayments();
                render.historyPayments();
                if (window.showToast) {
                    window.showToast(`❌ Ödeme iptal edildi: ${payment.username}`, 'warning');
                }
            });

            state.eventSource.onerror = () => {
                setTimeout(() => this.connect(), 3000);
            };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // MODAL MANAGEMENT
    // ═══════════════════════════════════════════════════════════
    const modal = {
        show(modalId) {
            const modalEl = document.getElementById(modalId);
            if (modalEl) {
                modalEl.classList.add('show');
            }
        },

        hide(modalId) {
            const modalEl = document.getElementById(modalId);
            if (modalEl) {
                modalEl.classList.remove('show');
            }
        }
    };

    // ═══════════════════════════════════════════════════════════
    // PUBLIC API (Global Functions)
    // ═══════════════════════════════════════════════════════════
    window.posShowTab = (tabName) => tabs.show(tabName);

    window.posCreatePayment = async () => {
        const username = document.getElementById('pos-new-username').value.trim();
        const amount = parseFloat(document.getElementById('pos-new-amount').value);
        const description = document.getElementById('pos-new-desc').value.trim();

        if (!username) {
            if (window.showToast) window.showToast('Oyuncu adı giriniz', 'warning');
            return;
        }

        if (!amount || amount <= 0) {
            if (window.showToast) window.showToast('Geçerli bir tutar giriniz', 'warning');
            return;
        }

        const btn = document.getElementById('pos-create-btn');
        btn.disabled = true;
        btn.textContent = 'Oluşturuluyor...';

        const result = await api.createPayment(username, amount, description);

        if (result.ok) {
            document.getElementById('pos-new-username').value = '';
            document.getElementById('pos-new-amount').value = '';
            document.getElementById('pos-new-desc').value = '';
            state.activePayments[result.payment.id] = result.payment;
            render.activePayments();
            tabs.show('active');
            if (window.showToast) window.showToast('Ödeme oluşturuldu', 'success');
        } else {
            if (window.showToast) window.showToast(result.error || 'Hata oluştu', 'danger');
        }

        btn.disabled = false;
        btn.textContent = '💳 Ödeme Oluştur';
    };

    window.posCancel = async (id) => {
        if (!confirm('Bu ödemeyi iptal etmek istediğinize emin misiniz?')) return;

        const result = await api.cancelPayment(id);
        if (result.ok) {
            if (window.showToast) window.showToast('Ödeme iptal edildi', 'success');
        } else {
            if (window.showToast) window.showToast(result.error || 'Hata oluştu', 'danger');
        }
    };

    window.posShowRefundModal = (paymentId) => {
        const payment = state.historyPayments.find(p => p.id === paymentId);
        if (!payment) return;

        const totalRefunded = payment.totalRefunded || 0;
        const availableAmount = (payment.sendedMoney || payment.amount) - totalRefunded;

        document.getElementById('refund-payment-id').value = paymentId;
        document.getElementById('refund-amount').value = '';
        document.getElementById('refund-reason').value = '';
        document.getElementById('refund-max-amount').textContent = utils.formatAmount(availableAmount);
        document.getElementById('refund-username').textContent = payment.username;
        
        if (availableAmount <= 0) {
            if (window.showToast) window.showToast('Bu ödeme tamamen iade edilmiş', 'warning');
            return;
        }

        modal.show('pos-refund-modal');
    };

    window.posShowDetailModal = (paymentId) => {
        const payment = state.historyPayments.find(p => p.id === paymentId);
        if (!payment) return;

        const totalRefunded = payment.totalRefunded || 0;
        const netAmount = payment.amount - totalRefunded;
        const refunds = payment.refunds || [];

        let refundHistoryHtml = '';
        if (refunds.length > 0) {
            refundHistoryHtml = refunds.map(refund => `
                <tr>
                    <td>${utils.formatTime(refund.refundedAt)}</td>
                    <td>${utils.formatAmount(refund.amount)}⛁</td>
                    <td>${utils.escape(refund.refundedBy)}</td>
                    <td>${refund.reason ? utils.escape(refund.reason) : '-'}</td>
                </tr>
            `).join('');
        } else {
            refundHistoryHtml = '<tr><td colspan="4" class="text-center">İade geçmişi bulunamadı</td></tr>';
        }

        document.getElementById('detail-username').textContent = payment.username;
        document.getElementById('detail-original-amount').textContent = utils.formatAmount(payment.amount);
        document.getElementById('detail-total-refunded').textContent = utils.formatAmount(totalRefunded);
        document.getElementById('detail-net-amount').textContent = utils.formatAmount(netAmount);
        document.getElementById('detail-refund-history').innerHTML = refundHistoryHtml;

        modal.show('pos-detail-modal');
    };

    window.posCloseDetailModal = () => {
        modal.hide('pos-detail-modal');
    };

    window.posCloseRefundModal = () => {
        modal.hide('pos-refund-modal');
    };

    window.posToggleRefundType = (type) => {
        document.querySelectorAll('.pos-refund-toggle button').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.type === type);
        });
        document.getElementById('refund-type').value = type;
        
        const input = document.getElementById('refund-amount');
        if (type === 'percentage') {
            input.placeholder = '0-100';
            input.max = '100';
        } else {
            input.placeholder = '0.00';
            input.removeAttribute('max');
        }
    };

    window.posProcessRefund = async () => {
        const paymentId = document.getElementById('refund-payment-id').value;
        const amount = parseFloat(document.getElementById('refund-amount').value);
        const type = document.getElementById('refund-type').value;
        const reason = document.getElementById('refund-reason').value.trim();
        const isPercentage = type === 'percentage';

        if (!amount || amount <= 0) {
            if (window.showToast) window.showToast('Geçerli bir miktar giriniz', 'warning');
            return;
        }

        if (isPercentage && amount > 100) {
            if (window.showToast) window.showToast('Yüzde 100\'den fazla olamaz', 'warning');
            return;
        }

        const btn = document.getElementById('refund-confirm-btn');
        btn.disabled = true;
        btn.textContent = 'İşleniyor...';

        const result = await api.refundPayment(paymentId, amount, isPercentage, reason);

        if (result.ok) {
            modal.hide('pos-refund-modal');
            if (window.showToast) window.showToast('İade işlemi başarılı', 'success');
            await api.loadPayments();
        } else {
            if (window.showToast) window.showToast(result.error || 'İade işlemi başarısız', 'danger');
        }

        btn.disabled = false;
        btn.textContent = '✓ İade Et';
    };

    // ═══════════════════════════════════════════════════════════
    // INITIALIZATION
    // ═══════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
        api.loadPayments();
        sse.connect();
        setInterval(() => render.updateTimers(), 1000);
    });

    // If DOM already loaded
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(() => {
            api.loadPayments();
            sse.connect();
            setInterval(() => render.updateTimers(), 1000);
        }, 1);
    }
})();
</script>
    
</body>
</html>
