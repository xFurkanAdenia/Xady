<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Sistemi</title>
</head>
<body>
    <div class="pos-container">
        <!-- Header -->
        <div class="pos-header">
            <div class="pos-header-left">
                <h1>💳 POS Sistemi</h1>
                <p class="pos-subtitle">Ödeme Yönetimi</p>
            </div>
            <div class="pos-header-right">
                <div class="pos-balance-card">
                    <span class="pos-balance-label">Bakiye</span>
                    <span class="pos-balance-value" id="pos-balance">0.00⛁</span>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="pos-tabs">
            <button class="pos-tab active" data-tab="create" onclick="posShowTab('create')">
                💳 Ödeme Al
            </button>
            <button class="pos-tab" data-tab="products" onclick="posShowTab('products')">
                📦 Ürünler
            </button>
            <button class="pos-tab" data-tab="active" onclick="posShowTab('active')">
                ⏳ Aktif (<span id="count-active">0</span>)
            </button>
            <button class="pos-tab" data-tab="history" onclick="posShowTab('history')">
                📋 Geçmiş
            </button>
        </div>

        <!-- Tab: Ödeme Al -->
        <div class="pos-tab-content active" id="tab-create">
            <div class="pos-card">
                <h2>Yeni Ödeme Talebi</h2>
                
                <!-- Ürün Seçimi -->
                <div class="pos-product-selection" id="product-selection">
                    <!-- Ürünler buraya -->
                </div>

                <div class="pos-form">
                    <div class="form-group">
                        <label>Oyuncu Adı *</label>
                        <input type="text" id="input-username" class="form-control" placeholder="Minecraft oyuncu adı">
                    </div>
                    <div class="form-group">
                        <label>Tutar (⛁) *</label>
                        <input type="number" id="input-amount" class="form-control" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Açıklama</label>
                        <input type="text" id="input-description" class="form-control" placeholder="İsteğe bağlı">
                    </div>
                    <button class="btn btn-primary btn-lg" onclick="posCreatePayment()">
                        💳 Ödeme Talebi Oluştur
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab: Ürünler -->
        <div class="pos-tab-content" id="tab-products">
            <div class="pos-card">
                <div class="pos-card-header">
                    <h2>Ürünlerim</h2>
                    <button class="btn btn-success" onclick="posShowProductModal()">
                        + Yeni Ürün
                    </button>
                </div>
                <div class="pos-products-list" id="products-list">
                    <!-- Ürünler buraya -->
                </div>
            </div>
        </div>

        <!-- Tab: Aktif Ödemeler -->
        <div class="pos-tab-content" id="tab-active">
            <div class="pos-payments-grid" id="active-grid">
                <!-- Aktif ödemeler -->
            </div>
        </div>

        <!-- Tab: Geçmiş -->
        <div class="pos-tab-content" id="tab-history">
            <div class="pos-payments-grid" id="history-grid">
                <!-- Geçmiş ödemeler -->
            </div>
        </div>
    </div>

    <!-- Modal: Ürün Ekle/Düzenle -->
    <div class="pos-modal" id="product-modal">
        <div class="pos-modal-content">
            <div class="pos-modal-header">
                <h2 id="product-modal-title">Yeni Ürün Ekle</h2>
                <button class="pos-modal-close" onclick="posCloseProductModal()">&times;</button>
            </div>
            <div class="pos-modal-body">
                <input type="hidden" id="product-edit-id">
                <div class="form-group">
                    <label>Ürün Adı *</label>
                    <input type="text" id="product-name" class="form-control" placeholder="Ürün adı">
                </div>
                <div class="form-group">
                    <label>Fiyat (⛁) *</label>
                    <input type="number" id="product-price" class="form-control" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>Açıklama</label>
                    <input type="text" id="product-description" class="form-control" placeholder="İsteğe bağlı">
                </div>
                <div class="form-group">
                    <label>Komut / Fonksiyonlar</label>
                    <div id="product-actions-list" class="pos-actions-list">
                        <!-- Actions buraya -->
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="posShowActionModal()">
                        + Ekle
                    </button>
                </div>
            </div>
            <div class="pos-modal-footer">
                <button class="btn btn-secondary" onclick="posCloseProductModal()">İptal</button>
                <button class="btn btn-primary" onclick="posSaveProduct()">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Modal: Komut/Fonksiyon Ekle -->
    <div class="pos-modal" id="action-modal">
        <div class="pos-modal-content pos-modal-sm">
            <div class="pos-modal-header">
                <h2>Komut / Fonksiyon Ekle</h2>
                <button class="pos-modal-close" onclick="posCloseActionModal()">&times;</button>
            </div>
            <div class="pos-modal-body">
                <div class="form-group">
                    <label>Tip</label>
                    <select id="action-type" class="form-control" onchange="posActionTypeChanged()">
                        <option value="command">Komut</option>
                        <option value="function" id="action-type-function">Fonksiyon</option>
                    </select>
                </div>
                <div class="form-group" id="action-command-group">
                    <label>Komut</label>
                    <input type="text" id="action-command" class="form-control" placeholder="/give {player} diamond 1">
                    <small class="form-text">{player} yerine oyuncu adı gelecek</small>
                </div>
                <div class="form-group" id="action-function-group" style="display: none;">
                    <label>Fonksiyon</label>
                    <select id="action-function" class="form-control">
                        <option value="">Fonksiyon seçiniz...</option>
                    </select>
                </div>
            </div>
            <div class="pos-modal-footer">
                <button class="btn btn-secondary" onclick="posCloseActionModal()">İptal</button>
                <button class="btn btn-primary" onclick="posAddAction()">Ekle</button>
            </div>
        </div>
    </div>

    <!-- Modal: İade -->
    <div class="pos-modal" id="refund-modal">
        <div class="pos-modal-content pos-modal-sm">
            <div class="pos-modal-header">
                <h2>Ödeme İadesi</h2>
                <button class="pos-modal-close" onclick="posCloseRefundModal()">&times;</button>
            </div>
            <div class="pos-modal-body">
                <input type="hidden" id="refund-payment-id">
                <div class="pos-refund-info" id="refund-info"></div>
                <div class="form-group">
                    <label>İade Tipi</label>
                    <select id="refund-type" class="form-control">
                        <option value="amount">Tutar</option>
                        <option value="percentage">Yüzde</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Miktar</label>
                    <input type="number" id="refund-amount" class="form-control" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>Sebep</label>
                    <input type="text" id="refund-reason" class="form-control" placeholder="İsteğe bağlı">
                </div>
            </div>
            <div class="pos-modal-footer">
                <button class="btn btn-secondary" onclick="posCloseRefundModal()">İptal</button>
                <button class="btn btn-danger" onclick="posProcessRefund()">İade Et</button>
            </div>
        </div>
    </div>

    <script src="pos-simple.js"></script>
</body>
</html>
