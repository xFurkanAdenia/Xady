<!-- WebPos POS Ekranı - pos.html -->
<style>
.pos-wrap {
    display: flex;
    gap: 20px;
    flex-direction: column;
}
.pos-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}
.pos-stats {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
}
.pos-stat-chip {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
}
.pos-stat-chip .stat-val {
    font-weight: 700;
    font-size: 16px;
    color: var(--text-main);
}
.pos-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}
@media (max-width: 900px) {
    .pos-grid { grid-template-columns: 1fr; }
}
.payment-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    position: relative;
    transition: box-shadow 0.2s, transform 0.18s;
    animation: slideIn 0.28s ease;
}
@keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}
.payment-card:hover {
    box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    transform: translateY(-2px);
}
.payment-card.status-success {
    border-color: var(--success, #2ecc71);
    background: linear-gradient(135deg, var(--bg-surface), rgba(46,204,113,0.07));
}
.payment-card.status-cancelled, .payment-card.status-timeout {
    border-color: var(--danger, #e74c3c);
    opacity: 0.7;
}
.pcard-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}
.pcard-username {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 6px;
}
.pcard-amount {
    font-size: 22px;
    font-weight: 800;
    color: var(--primary, #7c63f5);
    letter-spacing: -0.5px;
}
.pcard-desc {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
    word-break: break-word;
}
.pcard-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
}
.pcard-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}
.pcard-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
}
.badge-pending { background: rgba(124,99,245,0.15); color: var(--primary, #7c63f5); }
.badge-success { background: rgba(46,204,113,0.15); color: var(--success, #2ecc71); }
.badge-cancelled, .badge-timeout { background: rgba(231,76,60,0.15); color: var(--danger, #e74c3c); }
.create-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.timer-bar {
    height: 4px;
    background: rgba(124,99,245,0.2);
    border-radius: 2px;
    margin-bottom: 6px;
    overflow: hidden;
}
.timer-bar-fill {
    height: 100%;
    background: var(--primary, #7c63f5);
    border-radius: 2px;
    transition: width 1s linear;
}
.toast-pulse {
    animation: toastPulse 0.5s ease;
}
@keyframes toastPulse {
    0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.5); }
    70% { box-shadow: 0 0 0 14px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
}
.tab-bar {
    display: flex;
    gap: 4px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 18px;
}
.tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    border-radius: 6px 6px 0 0;
}
.tab-btn.active {
    color: var(--primary, #7c63f5);
    border-bottom-color: var(--primary, #7c63f5);
    background: rgba(124,99,245,0.07);
}
.tab-btn:hover:not(.active) { color: var(--text-main); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
</style>

<div class="pos-wrap">
    <!-- Header -->
    <div class="pos-header-row">
        <div>
            <h2 style="margin:0; font-size:22px; font-weight:800;">💳 POS Ödemeleri</h2>
            <p style="margin:4px 0 0; color:var(--text-muted); font-size:13px;">Anlık ödeme açma, takip ve geçmiş işlemleri</p>
        </div>
        <div class="pos-stats">
            <div class="pos-stat-chip">⏳ Bekleyen <span class="stat-val" id="pos-count-pending">0</span></div>
            <div class="pos-stat-chip">✅ Tamamlanan <span class="stat-val" id="pos-count-done">0</span></div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="window.posShowTab('active')">Aktif Ödemeler</button>
        <button class="tab-btn" onclick="window.posShowTab('history')">Geçmiş</button>
        <button class="tab-btn" onclick="window.posShowTab('create')">➕ Ödeme Oluştur</button>
    </div>

    <!-- TAB: Active -->
    <div class="tab-content active" id="pos-tab-active">
        <div id="pos-active-grid" class="pos-grid"></div>
    </div>

    <!-- TAB: History -->
    <div class="tab-content" id="pos-tab-history">
        <div id="pos-history-grid" class="pos-grid"></div>
    </div>

    <!-- TAB: Create -->
    <div class="tab-content" id="pos-tab-create">
        <div class="card" style="max-width: 480px;">
            <div class="card-header"><div class="card-title">Yeni Ödeme Oluştur</div></div>
            <div class="card-body">
                <div class="create-form">
                    <div class="form-group">
                        <label class="form-label">Oyuncu Adı</label>
                        <input type="text" id="pos-new-username" class="form-control" placeholder="StevePlayer">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tutar</label>
                        <input type="number" id="pos-new-amount" class="form-control" placeholder="1000" min="1" step="0.01">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Açıklama (opsiyonel)</label>
                        <input type="text" id="pos-new-desc" class="form-control" placeholder="VIP paket ücreti">
                    </div>
                    <button class="btn btn-primary" onclick="window.posCreatePayment()" id="pos-create-btn" style="margin-top: 6px;">
                        💳 Ödeme Aç
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    // --- State ---
    let activePayments = {};
    let historyPayments = [];
    let posEvt = null;

    // --- Tab ---
    window.posShowTab = function(tab) {
        document.querySelectorAll('.tab-btn').forEach((b, i) => {
            const tabs = ['active','history','create'];
            b.classList.toggle('active', tabs[i] === tab);
        });
        document.querySelectorAll('.tab-content').forEach((c, i) => {
            const tabs = ['pos-tab-active','pos-tab-history','pos-tab-create'];
            c.classList.toggle('active', c.id === 'pos-tab-' + tab);
        });
    };

    // --- Format ---
    function fmtAmount(n) {
        if (n == null) return '-';
        return Number(n).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function fmtTime(ts) {
        if (!ts) return '-';
        return new Date(ts).toLocaleString('tr-TR');
    }
    function timeAgo(ts) {
        const s = Math.floor((Date.now() - ts) / 1000);
        if (s < 60) return s + 's önce';
        if (s < 3600) return Math.floor(s/60) + 'dk önce';
        return fmtTime(ts);
    }
    function badgeClass(status) {
        if (status === 'success') return 'badge-success';
        if (status === 'cancelled' || status === 'timeout') return 'badge-cancelled';
        return 'badge-pending';
    }
    function badgeLabel(status) {
        if (status === 'success') return '✅ Tamamlandı';
        if (status === 'cancelled') return '❌ İptal edildi';
        if (status === 'timeout') return '⌛ Zaman aşımı';
        return '⏳ Bekliyor';
    }

    // --- Render: Active Card ---
    function renderActiveCard(p) {
        const div = document.createElement('div');
        div.className = 'payment-card';
        div.id = 'pcard-' + p.id;
        div.innerHTML = `
            <div class="pcard-top">
                <div>
                    <div class="pcard-username">👤 ${esc(p.username)}</div>
                    <div class="pcard-badge badge-pending">${badgeLabel(p.status)}</div>
                </div>
                <div class="pcard-amount">${fmtAmount(p.amount)}</div>
            </div>
            <div class="pcard-desc">${p.description ? '📝 ' + esc(p.description) : '<em>Açıklama yok</em>'}</div>
            <div class="pcard-meta">🕓 Oluşturuldu: ${fmtTime(p.createdAt)} &nbsp;|&nbsp; 👤 ${esc(p.createdBy)}</div>
            <div class="timer-bar"><div class="timer-bar-fill" id="timer-${p.id}" style="width:100%"></div></div>
            <div class="pcard-actions">
                <button class="btn btn-danger btn-sm" onclick="window.posCancel('${p.id}')">❌ İptal Et</button>
            </div>
        `;
        return div;
    }

    // --- Render: History Card ---
    function renderHistoryCard(p) {
        const div = document.createElement('div');
        div.className = 'payment-card status-' + p.status;
        div.innerHTML = `
            <div class="pcard-top">
                <div>
                    <div class="pcard-username">👤 ${esc(p.username)}</div>
                    <span class="pcard-badge ${badgeClass(p.status)}">${badgeLabel(p.status)}</span>
                </div>
                <div class="pcard-amount">${fmtAmount(p.amount)}</div>
            </div>
            <div class="pcard-desc">${p.description ? '📝 ' + esc(p.description) : '<em>Açıklama yok</em>'}</div>
            <div class="pcard-meta">
                🕓 ${fmtTime(p.createdAt)} → ${p.completedAt ? fmtTime(p.completedAt) : '-'}
                ${p.sendedMoney != null ? `&nbsp;|&nbsp; 💸 Gönderilen: ${fmtAmount(p.sendedMoney)}` : ''}
                ${p.change != null && p.change > 0 ? `&nbsp;|&nbsp; 🔄 Para üstü: ${fmtAmount(p.change)}` : ''}
            </div>
        `;
        return div;
    }

    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // --- Render All ---
    function renderActive() {
        const grid = document.getElementById('pos-active-grid');
        grid.innerHTML = '';
        const arr = Object.values(activePayments);
        if (arr.length === 0) {
            grid.innerHTML = '<div class="empty-state"><div class="icon">💸</div>Şu an bekleyen ödeme yok.</div>';
        } else {
            arr.forEach(p => grid.appendChild(renderActiveCard(p)));
        }
        document.getElementById('pos-count-pending').textContent = arr.length;
    }

    function renderHistory() {
        const grid = document.getElementById('pos-history-grid');
        grid.innerHTML = '';
        if (historyPayments.length === 0) {
            grid.innerHTML = '<div class="empty-state"><div class="icon">📋</div>Henüz tamamlanan ödeme yok.</div>';
        } else {
            historyPayments.forEach(p => grid.appendChild(renderHistoryCard(p)));
        }
        document.getElementById('pos-count-done').textContent = historyPayments.filter(p => p.status === 'success').length;
    }

    // --- Timer Bars ---
    function updateTimers() {
        const now = Date.now();
        Object.values(activePayments).forEach(p => {
            const el = document.getElementById('timer-' + p.id);
            if (!el) return;
            const timeout = 15 * 60 * 1000; // default, bilinemiyor ama görseli için yeterli
            const elapsed = now - p.createdAt;
            const pct = Math.max(0, 100 - (elapsed / timeout * 100));
            el.style.width = pct.toFixed(1) + '%';
            if (pct < 20) el.style.background = 'var(--danger, #e74c3c)';
            else if (pct < 50) el.style.background = '#f39c12';
            else el.style.background = 'var(--primary, #7c63f5)';
        });
    }

    // --- API ---
    async function loadPayments() {
        try {
            const [r1, r2] = await Promise.all([
                fetch('/api/pos/payments').then(r => r.json()),
                fetch('/api/pos/history').then(r => r.json()),
            ]);
            if (r1.ok) {
                activePayments = {};
                r1.payments.forEach(p => activePayments[p.id] = p);
            }
            if (r2.ok) {
                historyPayments = r2.payments;
            }
        } catch (e) {
            console.error('[WebPos]', e);
        }
        renderActive();
        renderHistory();
    }

    window.posCreatePayment = async function() {
        const username = document.getElementById('pos-new-username').value.trim();
        const amount = parseFloat(document.getElementById('pos-new-amount').value);
        const description = document.getElementById('pos-new-desc').value.trim();
        if (!username) { if(window.showToast) window.showToast('Oyuncu adı giriniz.', 'warning'); return; }
        if (!amount || amount <= 0) { if(window.showToast) window.showToast('Geçerli bir tutar giriniz.', 'warning'); return; }

        const btn = document.getElementById('pos-create-btn');
        btn.disabled = true;
        btn.textContent = 'Oluşturuluyor...';
        try {
            const res = await fetch('/api/pos/payments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, amount, description })
            });
            const data = await res.json();
            if (data.ok) {
                if(window.showToast) window.showToast('Ödeme oluşturuldu! Oyuncu para atabilir.', 'success');
                document.getElementById('pos-new-username').value = '';
                document.getElementById('pos-new-amount').value = '';
                document.getElementById('pos-new-desc').value = '';
                window.posShowTab('active');
                activePayments[data.payment.id] = data.payment;
                renderActive();
            } else {
                if(window.showToast) window.showToast(data.error || 'Ödeme oluşturulamadı.', 'danger');
            }
        } catch {
            if(window.showToast) window.showToast('Bağlantı hatası.', 'danger');
        } finally {
            btn.disabled = false;
            btn.textContent = '💳 Ödeme Aç';
        }
    };

    window.posCancel = async function(id) {
        if (!confirm('Bu ödemeyi iptal etmek istediğinize emin misiniz?')) return;
        try {
            const res = await fetch('/api/pos/payments/' + id, { method: 'DELETE' });
            const data = await res.json();
            if (data.ok) {
                if(window.showToast) window.showToast('Ödeme iptal edildi.', 'success');
            } else {
                if(window.showToast) window.showToast(data.error || 'İptal başarısız.', 'danger');
            }
        } catch {
            if(window.showToast) window.showToast('Bağlantı hatası.', 'danger');
        }
    };

    // --- SSE ---
    function connectSse() {
        if (posEvt) { posEvt.close(); posEvt = null; }
        posEvt = new EventSource('/api/pos/stream');
        window._posEvt = posEvt;

        posEvt.addEventListener('pos_new', e => {
            const p = JSON.parse(e.data);
            activePayments[p.id] = p;
            renderActive();
            if(window.showToast) window.showToast(`💳 Yeni ödeme: ${p.username} → ${p.amount}`, 'info');
        });

        posEvt.addEventListener('pos_complete', e => {
            const p = JSON.parse(e.data);
            delete activePayments[p.id];
            historyPayments.unshift(p);
            if (historyPayments.length > 100) historyPayments.pop();
            renderActive();
            renderHistory();
            // ✅ Toast bildirimi
            if(window.showToast) window.showToast(`✅ Ödeme tamamlandı: ${p.username}`, 'success');
        });

        posEvt.addEventListener('pos_cancel', e => {
            const p = JSON.parse(e.data);
            delete activePayments[p.id];
            historyPayments.unshift(p);
            if (historyPayments.length > 100) historyPayments.pop();
            renderActive();
            renderHistory();
            if(window.showToast) window.showToast(`❌ Ödeme iptal: ${p.username}`, 'warning');
        });

        posEvt.onerror = () => {
            setTimeout(connectSse, 3000);
        };
    }

    // --- Init ---
    loadPayments();
    connectSse();
    setInterval(updateTimers, 1000);
})();
</script>
