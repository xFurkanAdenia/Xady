<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xady Panel • Giriş</title>
  <link rel="stylesheet" href="/assets/login.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 2l7 4v6c0 5-3 9-7 10-4-1-7-5-7-10V6l7-4z" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>
            <path d="M9.5 12l1.8 1.8L14.8 10.3" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">Xady WebPanel</div>
        <div class="sub">Yönetim paneline erişmek için giriş yapın</div>
      </div>
      
      <div class="input-group">
        <label>Kullanıcı Adı</label>
        <input id="u" autocomplete="username" placeholder="Kullanıcı adınız" />
      </div>
      
      <div class="input-group">
        <label>Şifre</label>
        <input id="p" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      
      <button id="b">Giriş Yap</button>
      <div class="err" id="e"></div>
    </div>
  </div>
  <script>
    const uInput = document.getElementById("u");
    const pInput = document.getElementById("p");
    const btn = document.getElementById("b");
    const errDiv = document.getElementById("e");

    async function doLogin() {
      const username = uInput.value.trim();
      const password = pInput.value;
      if (!username || !password) {
        errDiv.innerText = "Kullanıcı adı ve şifre girin.";
        return;
      }
      btn.disabled = true;
      btn.innerText = "Giriş yapılıyor...";
      errDiv.innerText = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = "/";
        } else {
          errDiv.innerText = data.error === "banned" ? `Yasaklandınız: ${data.reason || ""}` : "Hatalı kullanıcı adı veya şifre.";
          btn.disabled = false;
          btn.innerText = "Giriş Yap";
        }
      } catch (e) {
        errDiv.innerText = "Bağlantı hatası oluştu.";
        btn.disabled = false;
        btn.innerText = "Giriş Yap";
      }
    }

    btn.addEventListener("click", doLogin);
    uInput.addEventListener("keydown", (e) => { if (e.key === "Enter") pInput.focus(); });
    pInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
  </script>
</body>
</html>
